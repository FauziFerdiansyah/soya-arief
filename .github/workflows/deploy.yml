name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Izin minimum yang dibutuhkan deploy Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Batalkan run lama kalau ada push baru
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Nilai ini publik (ikut ter-bundle), simpan sebagai Variables.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          VITE_CALENDAR_WORKER_URL: ${{ vars.VITE_CALENDAR_WORKER_URL }}
          # Username UI dan email internal Firebase Auth adalah nilai publik.
          VITE_ADMIN_USERNAME: ${{ vars.VITE_ADMIN_USERNAME || 'admin' }}
          VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL || 'admin@soyaarief.site' }}
          # Unsigned upload preset Cloudinary; keduanya nilai publik.
          VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ vars.VITE_CLOUDINARY_UPLOAD_PRESET }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Alihkan Pages dari mode "deploy from branch" ke "GitHub Actions"
          # secara otomatis, jadi tidak perlu diubah manual di Settings.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
